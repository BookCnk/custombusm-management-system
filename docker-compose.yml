services:
  app:
    container_name: custombus-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        DIRECT_URL: ${DIRECT_URL}
        CRON_SECRET: ${CRON_SECRET}
        JWT_SECRET: ${JWT_SECRET}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
        NODE_ENV: ${NODE_ENV:-production}
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
    expose:
      - "${PORT:-3000}"
    restart: unless-stopped
    networks:
      - shared_proxy
    # healthcheck:
    #   test:
    #     [
    #       "CMD-SHELL",
    #       "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/login').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
    #     ]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

networks:
  shared_proxy:
    external: true
